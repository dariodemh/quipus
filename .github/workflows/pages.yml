name: Publicar artículo

on:
  push:
    branches: [main]
    paths: ['articulo/*.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Solo el artículo y el lector (~7 MB), no el repo entero (160 MB): mismas URLs /quipus/articulo/
      - run: mkdir -p _site/articulo && cp articulo/*.html _site/articulo/ && touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}articulo/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
